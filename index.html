<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>写真グリッド</title>
<style>
  :root {
    --bg: #f5f5f4;
    --fg: #1c1917;
    --card: #ffffff;
    --border: #d6d3d1;
    --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917;
      --fg: #f5f5f4;
      --card: #292524;
      --border: #44403c;
      --accent: #60a5fa;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.5;
  }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.25rem; margin: 0 0 12px; }
  .stage {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    min-height: 240px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  canvas { max-width: 100%; max-height: 70vh; display: none; }
  .placeholder { color: #78716c; padding: 24px; text-align: center; }
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    margin-top: 12px;
  }
  .row { display: flex; align-items: center; gap: 12px; margin: 10px 0; }
  .row label { flex: 0 0 5.5em; font-size: 0.9rem; }
  .row input[type=range] { flex: 1; }
  .row output { flex: 0 0 3em; text-align: right; font-size: 0.85rem; }
  select, input[type=color] {
    font: inherit;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--fg);
  }
  select { flex: 1; }
  input[type=color] { height: 38px; width: 64px; padding: 2px; }
  .buttons { display: flex; gap: 8px; margin-top: 12px; }
  button, .filebtn {
    flex: 1;
    font: inherit;
    font-weight: 600;
    text-align: center;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  input[type=file] { display: none; }
  .note { font-size: 0.8rem; color: #78716c; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>📷 写真グリッド</h1>

  <div class="stage">
    <div class="placeholder" id="placeholder">写真を選ぶと、ここにグリッドが重なって表示されます</div>
    <canvas id="canvas"></canvas>
  </div>

  <div class="panel">
    <div class="row">
      <label for="type">グリッド</label>
      <select id="type">
        <option value="thirds">三分割法（3×3）</option>
        <option value="square">正方形グリッド</option>
        <option value="diagonal">対角線</option>
        <option value="golden">黄金比（1:1.618）</option>
        <option value="center">中央十字</option>
        <option value="none">なし</option>
      </select>
    </div>
    <div class="row" id="divRow" style="display:none">
      <label for="divs">分割数</label>
      <input type="range" id="divs" min="2" max="12" value="6">
      <output id="divsOut">6</output>
    </div>
    <div class="row">
      <label for="color">線の色</label>
      <input type="color" id="color" value="#ffffff">
    </div>
    <div class="row">
      <label for="width">線の太さ</label>
      <input type="range" id="width" min="1" max="10" value="2">
      <output id="widthOut">2</output>
    </div>
    <div class="row">
      <label for="alpha">透明度</label>
      <input type="range" id="alpha" min="10" max="100" value="80">
      <output id="alphaOut">80%</output>
    </div>
  </div>

  <div class="buttons">
    <label class="filebtn secondary" style="background:transparent;color:var(--accent)">
      写真を選ぶ
      <input type="file" id="file" accept="image/*">
    </label>
    <button id="save" disabled>グリッド入りで保存</button>
  </div>
  <p class="note">写真は端末の外に送信されません。ブラウザ内だけで処理します。</p>
</main>

<script>
(() => {
  const MAX_SIDE = 4096; // 保存画像の長辺の上限（メモリ対策）
  const $ = id => document.getElementById(id);
  const canvas = $('canvas');
  const ctx = canvas.getContext('2d');
  let bitmap = null;
  let fileName = 'photo';

  // 線の太さは画像の大きさに合わせて見た目が一定になるよう補正
  function lineWidthPx() {
    return Number($('width').value) * Math.max(canvas.width, canvas.height) / 1000;
  }

  function line(x1, y1, x2, y2) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  function drawGrid() {
    if (!bitmap) return;
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    ctx.drawImage(bitmap, 0, 0, w, h);

    const type = $('type').value;
    if (type === 'none') return;

    ctx.save();
    ctx.globalAlpha = Number($('alpha').value) / 100;
    ctx.strokeStyle = $('color').value;
    ctx.lineWidth = lineWidthPx();
    // 白線が明るい背景で見えにくいため、うっすら影を付ける
    ctx.shadowColor = 'rgba(0,0,0,0.45)';
    ctx.shadowBlur = ctx.lineWidth * 1.5;

    const vLines = [], hLines = [];
    if (type === 'thirds') {
      vLines.push(w / 3, w * 2 / 3);
      hLines.push(h / 3, h * 2 / 3);
    } else if (type === 'golden') {
      const g = 0.381966;
      vLines.push(w * g, w * (1 - g));
      hLines.push(h * g, h * (1 - g));
    } else if (type === 'center') {
      vLines.push(w / 2);
      hLines.push(h / 2);
    } else if (type === 'square') {
      // 短辺を基準に正方形のマスを作る
      const n = Number($('divs').value);
      const cell = Math.min(w, h) / n;
      for (let x = cell; x < w - 1; x += cell) vLines.push(x);
      for (let y = cell; y < h - 1; y += cell) hLines.push(y);
    } else if (type === 'diagonal') {
      line(0, 0, w, h);
      line(w, 0, 0, h);
    }
    vLines.forEach(x => line(x, 0, x, h));
    hLines.forEach(y => line(0, y, w, y));
    ctx.restore();
  }

  async function loadFile(file) {
    if (!file) return;
    try {
      // imageOrientation: スマホ写真の回転情報(EXIF)を反映
      bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
    } catch (e) {
      alert('この画像は読み込めませんでした。JPEG / PNG などを選んでください。');
      return;
    }
    fileName = file.name.replace(/\.[^.]+$/, '') || 'photo';
    const scale = Math.min(1, MAX_SIDE / Math.max(bitmap.width, bitmap.height));
    canvas.width = Math.round(bitmap.width * scale);
    canvas.height = Math.round(bitmap.height * scale);
    canvas.style.display = 'block';
    $('placeholder').style.display = 'none';
    $('save').disabled = false;
    drawGrid();
  }

  async function save() {
    if (!bitmap) return;
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    const name = `${fileName}_grid.png`;
    const file = new File([blob], name, { type: 'image/png' });

    // スマホでは共有シートから「写真に保存」できるようにする
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file] });
        return;
      } catch (e) {
        if (e.name === 'AbortError') return;
      }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function syncUI() {
    $('divRow').style.display = $('type').value === 'square' ? 'flex' : 'none';
    $('divsOut').textContent = $('divs').value;
    $('widthOut').textContent = $('width').value;
    $('alphaOut').textContent = $('alpha').value + '%';
    drawGrid();
  }

  ['type', 'divs', 'color', 'width', 'alpha'].forEach(id =>
    $(id).addEventListener('input', syncUI));
  $('file').addEventListener('change', e => loadFile(e.target.files[0]));
  $('save').addEventListener('click', save);
  syncUI();
})();
</script>
</body>
</html>
